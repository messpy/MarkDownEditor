<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Editor</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-left">
      <button id="btnOpen" type="button">Open</button>
      <button id="btnSave" type="button">Save</button>
      <button id="btnSaveAs" type="button">Save As</button>
      <span class="sep"></span>
      <label class="chk"><input id="chkAutosave" type="checkbox" checked> Autosave</label>
    </div>

    <div class="toolbar-right">
      <span id="status" class="status">Ready</span>
    </div>

    <input id="fileInput" type="file" accept=".md,.markdown,text/markdown,text/plain" hidden />
  </header>

  <main class="layout">
    <section class="pane">
      <div class="pane-title">
        <span id="fileLabel">untitled.md</span>
        <span id="dirtyMark" class="dirty" title="未保存">*</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>

    <section class="pane">
      <div class="pane-title">Preview</div>
      <article id="preview" class="preview"></article>
    </section>
  </main>

  <!-- marked + DOMPurify (XSS対策) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
